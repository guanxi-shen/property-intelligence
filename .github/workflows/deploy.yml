name: Deploy to Cloud Run

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.CREDENTIALS_DICT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Deploy to Cloud Run
        run: |
          cat > env-vars.yaml << EOF
          GCP_PROJECT_ID: "${{ secrets.GCP_PROJECT_ID }}"
          GCP_PROJECT_NUMBER: "${{ secrets.GCP_PROJECT_NUMBER }}"
          GOOGLE_CLOUD_REGION: "us-central1"
          BUCKET_NAME: "${{ secrets.BUCKET_NAME }}"
          TEXT_SEARCH_API_ENDPOINT: "${{ secrets.TEXT_SEARCH_API_ENDPOINT }}"
          TEXT_SEARCH_INDEX_ENDPOINT: "${{ secrets.TEXT_SEARCH_INDEX_ENDPOINT }}"
          TEXT_SEARCH_DEPLOYED_INDEX_ID: "${{ secrets.TEXT_SEARCH_DEPLOYED_INDEX_ID }}"
          MULTIMODAL_SEARCH_API_ENDPOINT: "${{ secrets.MULTIMODAL_SEARCH_API_ENDPOINT }}"
          MULTIMODAL_SEARCH_INDEX_ENDPOINT: "${{ secrets.MULTIMODAL_SEARCH_INDEX_ENDPOINT }}"
          MULTIMODAL_SEARCH_DEPLOYED_INDEX_ID: "${{ secrets.MULTIMODAL_SEARCH_DEPLOYED_INDEX_ID }}"
          DOCUMENT_AI_PROCESSOR_ID: "${{ secrets.DOCUMENT_AI_PROCESSOR_ID }}"
          DOCUMENT_AI_LOCATION: "us"
          credentials_dict: '${{ secrets.CREDENTIALS_DICT }}'
          EOF

          cat env-vars.yaml
          gcloud run deploy property-intelligence \
            --source . \
            --platform managed \
            --region us-central1 \
            --port 8080 \
            --memory 4Gi \
            --cpu 2 \
            --cpu-boost \
            --min-instances 0 \
            --max-instances 5 \
            --concurrency 40 \
            --timeout 1800 \
            --execution-environment gen2 \
            --allow-unauthenticated \
            --env-vars-file env-vars.yaml

      - name: Create Eventarc Trigger
        run: |
          gcloud eventarc triggers describe property-upload-trigger \
            --location=us-central1 2>/dev/null || \
          gcloud eventarc triggers create property-upload-trigger \
            --location=us-central1 \
            --destination-run-service=property-intelligence \
            --destination-run-region=us-central1 \
            --destination-run-path=/pipeline/trigger \
            --event-filters="type=google.cloud.storage.object.v1.finalized" \
            --event-filters="bucket=${{ secrets.BUCKET_NAME }}" \
            --service-account=${{ secrets.SERVICE_ACCOUNT_EMAIL }}

      - name: Get Service URL
        run: |
          SERVICE_URL=$(gcloud run services describe property-intelligence --region=us-central1 --format='value(status.url)')
          echo "Deployed to: $SERVICE_URL"
