name: Deploy to Cloud Run

on:
  push:
    branches: [main]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  SERVICE_NAME: property-intelligence

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.CREDENTIALS_DICT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker

      - name: Build and Push
        run: |
          docker build -t gcr.io/$PROJECT_ID/$SERVICE_NAME .
          docker push gcr.io/$PROJECT_ID/$SERVICE_NAME

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy $SERVICE_NAME \
            --image gcr.io/$PROJECT_ID/$SERVICE_NAME \
            --region $REGION \
            --platform managed \
            --memory 4Gi \
            --cpu 2 \
            --timeout 1800 \
            --min-instances 0 \
            --max-instances 5 \
            --set-env-vars "GCP_PROJECT_ID=$PROJECT_ID" \
            --set-env-vars "GOOGLE_CLOUD_REGION=$REGION" \
            --set-env-vars "BUCKET_NAME=${{ secrets.BUCKET_NAME }}" \
            --set-env-vars "TEXT_SEARCH_API_ENDPOINT=${{ secrets.TEXT_SEARCH_API_ENDPOINT }}" \
            --set-env-vars "TEXT_SEARCH_INDEX_ENDPOINT=${{ secrets.TEXT_SEARCH_INDEX_ENDPOINT }}" \
            --set-env-vars "TEXT_SEARCH_DEPLOYED_INDEX_ID=${{ secrets.TEXT_SEARCH_DEPLOYED_INDEX_ID }}" \
            --set-env-vars "MULTIMODAL_SEARCH_API_ENDPOINT=${{ secrets.MULTIMODAL_SEARCH_API_ENDPOINT }}" \
            --set-env-vars "MULTIMODAL_SEARCH_INDEX_ENDPOINT=${{ secrets.MULTIMODAL_SEARCH_INDEX_ENDPOINT }}" \
            --set-env-vars "MULTIMODAL_SEARCH_DEPLOYED_INDEX_ID=${{ secrets.MULTIMODAL_SEARCH_DEPLOYED_INDEX_ID }}" \
            --set-env-vars "DOCUMENT_AI_PROCESSOR_ID=${{ secrets.DOCUMENT_AI_PROCESSOR_ID }}" \
            --set-env-vars "DOCUMENT_AI_LOCATION=us" \
            --set-env-vars "GCP_PROJECT_NUMBER=${{ secrets.GCP_PROJECT_NUMBER }}" \
            --set-env-vars "credentials_dict=${{ secrets.CREDENTIALS_DICT }}" \
            --allow-unauthenticated

      - name: Create Eventarc Trigger
        run: |
          gcloud eventarc triggers describe property-upload-trigger \
            --location=$REGION 2>/dev/null || \
          gcloud eventarc triggers create property-upload-trigger \
            --location=$REGION \
            --destination-run-service=$SERVICE_NAME \
            --destination-run-region=$REGION \
            --destination-run-path=/pipeline/trigger \
            --event-filters="type=google.cloud.storage.object.v1.finalized" \
            --event-filters="bucket=${{ secrets.BUCKET_NAME }}" \
            --service-account=${{ secrets.SERVICE_ACCOUNT_EMAIL }}
